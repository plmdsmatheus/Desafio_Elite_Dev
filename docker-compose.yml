services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventos_db
    ports:
      # 5433 no host para não colidir com um Postgres local já rodando em 5432.
      # Dentro da rede do Compose o backend continua falando com "db:5432".
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventos_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Dentro da rede do Compose o Postgres é acessado pelo nome do serviço,
      # não por "localhost" — sobrescreve o valor do .env só para essa variável.
      DATABASE_URL: postgres://postgres:postgres@db:5432/eventos_db
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
