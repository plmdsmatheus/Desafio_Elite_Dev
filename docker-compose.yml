services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventos_db
    ports:
      # 5433 on the host to avoid colliding with a local Postgres already on 5432.
      # Inside the Compose network the backend still talks to "db:5432".
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventos_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Inside the Compose network Postgres is reached by service name, not
      # "localhost" — overrides just this one variable from the .env file.
      DATABASE_URL: postgres://postgres:postgres@db:5432/eventos_db
    # Overrides the Dockerfile's CMD (which is production-oriented — gunicorn,
    # no autoreload — for a plain `docker build`/cloud deploy like Render).
    # Local dev wants the Django dev server instead: autoreload on every save
    # (the bind mount below), plus DEBUG from .env.
    command: sh -c "python manage.py migrate && python manage.py seed_demo_data && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      # Backend reached through the browser, not the Compose network — the
      # API calls come from the user's machine, not from inside the container.
      VITE_API_BASE_URL: http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
